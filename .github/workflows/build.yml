name: Test ve APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ZE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Only the hand-maintained Android files are tracked; generate the rest.
      # `flutter create` never overwrites existing files.
      - name: Android iskeletini oluştur
        run: flutter create --project-name zahit_efendi --org com.esatgungoren --platforms android --no-pub .

      - run: flutter pub get

      - name: Uygulama ikonu
        run: dart run flutter_launcher_icons

      - name: Analiz ve testler
        run: |
          set -o pipefail
          { flutter analyze --no-fatal-infos && flutter test --reporter expanded; } 2>&1 | tee ci.log

      # Logs are not reachable from the dev sandbox; publish them to a branch on failure.
      - name: Hata kaydını yayınla
        if: failure()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan ci-logs
          git rm -rfq --cached .
          git add -f ci.log
          git commit -qm "CI log ${{ github.sha }}"
          git push -f origin ci-logs

      - name: İmza anahtarı
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ZE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ZE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK derle
        env:
          ZE_KEYSTORE_PASSWORD: ${{ secrets.ZE_KEYSTORE_PASSWORD }}
          ZE_KEY_ALIAS: ${{ secrets.ZE_KEY_ALIAS }}
          ZE_KEY_PASSWORD: ${{ secrets.ZE_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - run: mv build/app/outputs/flutter-apk/app-release.apk zahit-efendi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zahit-efendi-apk
          path: zahit-efendi.apk

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zahit Efendi 1.0.${{ github.run_number }}
          files: zahit-efendi.apk
