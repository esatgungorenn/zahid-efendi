name: zahit_efendi
description: LGS deneme takip uygulaması.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: ^1.2.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_picker: 13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/schools.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#3C3489"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
